<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#5637b9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-192.svg" />
    <link rel="stylesheet" href="styles.css" />
    <title>梦幻消除战 · 体力提醒器</title>
  </head>
  <body>
    <main class="app-shell">
      <header>
        <p class="eyebrow">梦幻消除战</p>
        <h1>体力提醒器</h1>
        <p class="subtitle">每 2 分钟恢复 1 点，最高 100 点</p>
      </header>

      <section class="energy-card" aria-live="polite">
        <div class="energy-topline">
          <span>当前体力</span>
          <span id="status-badge" class="status-badge">恢复中</span>
        </div>
        <div class="energy-number"><strong id="energy-value">--</strong><span>/ 100</span></div>
        <div class="progress-track" aria-hidden="true"><div id="progress-fill" class="progress-fill"></div></div>
        <p id="recovery-message" class="recovery-message">请先设置体力记录</p>
      </section>

      <section class="form-card" aria-labelledby="record-title">
        <div class="card-heading"><h2 id="record-title">体力记录</h2><span>自动保存</span></div>
        <label>
          <span class="label-row">最后一次使用体力的时间 <button id="use-current-time" class="text-button" type="button">使用现在时间</button></span>
          <input id="last-used-time" type="datetime-local" />
        </label>
        <label>
          使用后剩余体力
          <div class="number-input">
            <button type="button" id="decrease" aria-label="减少体力">−</button>
            <input id="remaining-energy" type="number" min="0" max="100" inputmode="numeric" placeholder="例如：45" />
            <button type="button" id="increase" aria-label="增加体力">+</button>
          </div>
        </label>
        <button id="save-record" class="primary-button" type="button">开始计算体力</button>
      </section>

      <section class="reminder-card">
        <div>
          <h2>满体力提醒</h2>
          <p id="notification-copy">开启通知后，体力满时将提醒你。</p>
        </div>
        <button id="notification-button" class="outline-button" type="button">开启提醒</button>
      </section>

      <p class="install-tip">想放到桌面：在手机浏览器菜单中选择“添加到主屏幕”。</p>
    </main>
    <div id="toast" class="toast" role="alert" aria-live="assertive"></div>
    <script src="push-config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
